services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    volumes:
      # postgres:18+ expects a single mount at /var/lib/postgresql (data lands
      # under a major-version subdirectory inside). Older tags used /data.
      - pgdata:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      # -h forces a TCP check. Without it pg_isready talks over the Unix socket
      # and reports ready during the image's init phase, when only a temporary
      # socket-only server is running and migrations are still being applied.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U todo -d todo"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://todo:todo@db:5432/todo?sslmode=disable
      JWT_SECRET: change-me-in-prod
      JWT_TTL: 24h
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
